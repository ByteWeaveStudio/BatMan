name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish; queue at most one more behind it.
concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # A project site is served from /<repo>/. A user site or a custom domain
      # is served from the root, and must not carry the prefix.
      - name: Resolve base path and canonical URL
        id: site
        run: |
          repo='${{ github.event.repository.name }}'
          owner='${{ github.repository_owner }}'
          owner_lc=$(echo "$owner" | tr '[:upper:]' '[:lower:]')
          if [ -f public/CNAME ]; then
            host=$(head -n1 public/CNAME | tr -d '[:space:]')
            base='/'; url="https://$host/"
          elif [ "$repo" = "$owner_lc.github.io" ]; then
            base='/'; url="https://$owner_lc.github.io/"
          else
            base="/$repo/"; url="https://$owner_lc.github.io/$repo/"
          fi
          echo "base=$base" >> "$GITHUB_OUTPUT"
          echo "url=$url"  >> "$GITHUB_OUTPUT"
          echo "Building for $url (base $base)"

      - name: Build
        env:
          VITE_BASE: ${{ steps.site.outputs.base }}
          VITE_SITE_URL: ${{ steps.site.outputs.url }}
        run: npm run build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
