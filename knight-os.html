<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KnightOS - BatMan</title>
  <link rel="icon" type="image/png" href="./assets/img/favicon.png">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="./assets/styles.css">
</head>
<body>
  <div id="app-header"></div>

  <div id="knight-root" class="container-fluid py-4">
    <div id="knight-loader" class="d-flex justify-content-center align-items-center" style="min-height: calc(100vh - 140px);">
      <div class="spinner-border text-primary" role="status" aria-label="Loading">
        <span class="visually-hidden">Loading...</span>
      </div>
    </div>

    <div id="knight-content" class="d-none">
      <div id="knight-pillars" class="knight-grid"></div>
      <div id="knight-detail" class="knight-grid knight-detail-row"></div>
    </div>
  </div>

  <div class="modal fade" id="knight-delete-modal" tabindex="-1" aria-labelledby="knight-delete-modal-label" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title" id="knight-delete-modal-label">Confirm deletion</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body" id="knight-delete-modal-body">
          This action cannot be undone.
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-outline-secondary" data-action="cancel-delete" data-bs-dismiss="modal">Cancel</button>
          <button type="button" class="btn btn-danger" data-action="confirm-delete">Delete</button>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script type="module">
    import { requireAuth } from './assets/js/auth.js';
    import { initHeader } from './assets/js/header.js';
    import { initKnightOs } from './assets/js/knight-os.js';

    requireAuth().then(() => {
      initHeader();
      initKnightOs();
    });
  </script>
</body>
</html>
