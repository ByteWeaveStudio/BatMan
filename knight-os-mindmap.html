<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KnightOS Mind Map - BatMan</title>
  <link rel="icon" type="image/png" href="./assets/img/favicon.png">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="./assets/styles.css">
  <link rel="stylesheet" href="./assets/knight-os-mindmap.css">
</head>
<body>
  <div id="app-header"></div>

  <div id="kmm-root">
    <div id="kmm-loader" class="kmm-loader">
      <div class="spinner-border text-primary" role="status" aria-label="Loading">
        <span class="visually-hidden">Loading...</span>
      </div>
    </div>

    <div id="kmm-content" class="kmm-content d-none">
      <div class="kmm-canvas-wrap">
        <svg id="kmm-canvas" class="kmm-canvas" preserveAspectRatio="xMidYMid meet" viewBox="-640 -520 1280 1040"></svg>
        <div class="kmm-canvas-controls">
          <button type="button" class="kmm-zoom-btn" data-action="zoom-in" title="Zoom in" aria-label="Zoom in">+</button>
          <button type="button" class="kmm-zoom-btn" data-action="zoom-out" title="Zoom out" aria-label="Zoom out">−</button>
          <button type="button" class="kmm-zoom-btn" data-action="zoom-reset" title="Reset view" aria-label="Reset view">⟳</button>
        </div>
        <div class="kmm-legend">
          <span><span class="kmm-legend-dot kmm-legend-dot--bright"></span>active branch</span>
          <span><span class="kmm-legend-dot kmm-legend-dot--dim"></span>neglected</span>
          <span><span class="kmm-legend-dash"></span>missing — tap "+" to add</span>
        </div>
        <div class="kmm-hint" data-canvas-hint>
          Tap any node to focus. Tap empty space to deselect.
        </div>
      </div>

      <aside id="kmm-panel" class="kmm-panel" aria-live="polite">
        <div class="kmm-panel-empty" data-panel-empty>
          <p class="kmm-panel-empty-title">Tap a node to focus</p>
          <p class="kmm-panel-empty-sub">Sub-areas, topics, and tasks will appear here for editing.</p>
        </div>
      </aside>
    </div>
  </div>

  <div class="modal fade" id="kmm-delete-modal" tabindex="-1" aria-labelledby="kmm-delete-modal-label" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title" id="kmm-delete-modal-label">Confirm deletion</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body" id="kmm-delete-modal-body">
          This action cannot be undone.
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-outline-secondary" data-action="cancel-delete" data-bs-dismiss="modal">Cancel</button>
          <button type="button" class="btn btn-danger" data-action="confirm-delete">Delete</button>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script type="module">
    import { requireAuth } from './assets/js/auth.js';
    import { initHeader } from './assets/js/header.js';
    import { initKnightMindmap } from './assets/js/knight-os-mindmap.js';

    requireAuth().then(() => {
      initHeader();
      initKnightMindmap();
    });
  </script>
</body>
</html>
