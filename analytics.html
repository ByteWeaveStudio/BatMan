<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Analytics - BatMan</title>
  <link rel="icon" type="image/png" href="./assets/img/favicon.png">
  <link rel="apple-touch-icon" href="./assets/img/favicon.png">
  <meta name="theme-color" content="#212529">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="BatMan">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="./assets/styles.css">
</head>
<body>
  <div id="app-header"></div>
  
  <div class="container-fluid py-4">
    <div class="row mb-4">
      <div class="col-md-6">
        <div class="d-flex align-items-center gap-3">
          <label for="analytics-month-selector" class="mb-0 fw-bold">Month:</label>
          <select id="analytics-month-selector" class="form-select" style="width: auto;">
            <!-- Options will be populated by JS -->
          </select>
        </div>
      </div>
    </div>
    
    <div class="row mb-4">
      <!-- Monthly Average Completion % Chart -->
      <div class="col-12 col-lg-6 mb-3">
        <div class="chart-container">
          <h6 class="chart-title">Monthly Average Completion % - Year View</h6>
          <canvas id="monthlyAverageChart"></canvas>
        </div>
      </div>

      <!-- Task-wise Completion % Chart -->
      <div class="col-12 col-lg-6 mb-3">
        <div class="chart-container">
          <h6 class="chart-title">Task-wise Completion % - Selected Month</h6>
          <canvas id="taskWiseChart"></canvas>
        </div>
      </div>

      <!-- Yearly Completion Heatmap -->
      <div class="col-12">
        <div class="chart-container">
          <div class="d-flex flex-wrap align-items-center justify-content-between gap-3 mb-3">
            <h6 class="chart-title mb-0">Yearly Completion Heatmap</h6>
            <div id="yearlyHeatmapLegend" class="heatmap-legend"></div>
          </div>
          <div class="heatmap-scroll">
            <div id="yearlyHeatmap" class="heatmap-root"></div>
          </div>
        </div>
      </div>

      <!-- Weight Tracker -->
      <div class="col-12 mt-2">
        <div class="chart-container">
          <div class="d-flex flex-wrap align-items-center justify-content-between gap-3 mb-3">
            <h6 class="chart-title mb-0">Weight Tracker</h6>
            <div class="d-flex flex-wrap align-items-center gap-2" id="weightQuickAdd">
              <input type="date" id="weightDate" class="form-control form-control-sm" style="width: 11rem;">
              <input type="number" id="weightValue" class="form-control form-control-sm" placeholder="kg" step="0.1" min="0" style="width: 7rem;">
              <button type="button" id="weightAddBtn" class="btn btn-sm btn-primary">Add</button>
              <button type="button" id="weightTargetsBtn" class="btn btn-sm btn-outline-secondary" data-bs-toggle="modal" data-bs-target="#weightTargetsModal">Targets</button>
              <span id="weightLatest" class="text-muted small ms-2"></span>
            </div>
          </div>
          <div class="chart-hscroll">
            <div class="weight-chart-inner">
              <canvas id="weightChart"></canvas>
            </div>
          </div>
          <div id="weightEmpty" class="text-center text-muted p-4 d-none">No weight entries yet for this year. Add one above.</div>
        </div>
      </div>
    </div>
  </div>

  <!-- Weight Targets Modal -->
  <div class="modal fade" id="weightTargetsModal" tabindex="-1" aria-labelledby="weightTargetsModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title" id="weightTargetsModalLabel">Monthly Weight Targets</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body">
          <p class="text-muted small mb-3">Set the goal weight for each month. Empty months have no target line.</p>
          <div class="row g-2" id="weightTargetsGrid"></div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
          <button type="button" class="btn btn-primary" id="weightTargetsSaveBtn">Save Targets</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Bootstrap -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  
  <!-- Chart.js -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
  
  <!-- App Scripts (ES Modules) -->
  <script type="module">
    import { requireAuth } from './assets/js/auth.js';
    import { initHeader } from './assets/js/header.js';
    import { initAnalytics } from './assets/js/analytics.js';
    
    // Initialize app
    requireAuth().then(() => {
      initHeader();
      initAnalytics();
    });
  </script>
</body>
</html>
