    <script>
      // Applied before paint so the first frame is already in the right theme.
      (function () {
        try {
          var stored = localStorage.getItem('batman.theme');
          var theme = stored === 'light' || stored === 'dark' ? stored
            : (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
          document.documentElement.dataset.theme = theme;
        } catch (e) {
          document.documentElement.dataset.theme = 'light';
        }
      })();
    </script>

    <div id="root"></div>

    <!--
      The app is client-rendered, so a crawler that does not execute JavaScript
      sees an empty root. This mirrors the landing page in plain markup so the
      product is legible to those crawlers and to anyone browsing without JS.
      Keep it in step with the landing copy — it must not say anything the
      rendered page doesn't.
    -->

        .ns a { color: #a16207; }
      </style>
      <main class="ns">
        <h1>BatMan — goals, habits, money and growth, one year at a time</h1>
        <p>
          BatMan is a year-scoped personal operating system. Pick a year and the whole app follows it:
          goals, habits, spending, savings and long-term growth. It is free, private to your account,
          works on phone and desktop, and installs to your home screen.
        </p>

        <h2>What it does</h2>
        <ul>
          <li><strong>Goals and habits.</strong> Yearly, quarterly and monthly goals that archive themselves when the period rolls over, plus a grid of every habit against every day of the month.</li>
          <li><strong>Analytics.</strong> Completion by month, consistency per habit, a heatmap of the whole year, and weight tracking against a target you set for each month.</li>
          <li><strong>Expenses.</strong> Log spending against your own categories and see where a month or a year actually went, ranked.</li>
          <li><strong>Portfolio.</strong> A twelve-month income and expense sheet where every figure opens into its own list of dated line items.</li>
          <li><strong>Growth.</strong> Health, relationships, finance and career, each broken into areas, topics and tasks, readable as a tree or a radial mind map.</li>
        </ul>

        <h2>How it works</h2>
        <p>
          Everything is scoped to a single year, so last year stays exactly as you left it and this
          year starts clean. Changes sync live across every device you are signed in on. Every path
          in the database is locked to your account — there is no tracking, no advertising and no
          third-party analytics.
        </p>

        <h2>Get started</h2>
        <p>
          <a href="__SITE_URL__register">Create an account</a> or
          <a href="__SITE_URL__login">sign in</a>. This page needs JavaScript to run the app itself.
        </p>
